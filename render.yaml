services:
  - type: web
    name: ai-juhe-chat
    env: docker
    region: singapore
    plan: starter
    buildCommand: docker build -t ai-juhe-chat .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: ai-juhe-db
          property: connectionString
      # Redis URL 需要手动配置（使用 Upstash 免费 Redis）
      # 1. 访问 https://upstash.com 注册
      # 2. 创建免费 Redis
      # 3. 复制 REST API URL（格式：https://xxx.upstash.io）
      # 4. 在 Render 控制台添加此环境变量
      - key: REDIS_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/.data/uploads
      - key: MIMO_BASE_URL
        value: https://token-plan-cn.xiaomimimo.com/v1
      - key: MIMO_API_KEY
        sync: false
      - key: MIMO_MODEL
        value: mimo-v2.5
      - key: VOLCENGINE_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: VOLCENGINE_API_KEY
        sync: false
    disk: ~

databases:
  - name: ai-juhe-db
    databaseName: ai_chat
    plan: starter
    region: singapore
